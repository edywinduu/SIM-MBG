<svg width="520" height="320" viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mintBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF9F5" />
      <stop offset="50%" stop-color="#B8F2E2" />
      <stop offset="100%" stop-color="#DDF7EF" />
    </linearGradient>
    <filter id="cardShadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f2b26" flood-opacity="0.2" />
    </filter>
    <filter id="badgeShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="520" height="320" rx="20" fill="url(#mintBg3)" />
  <circle cx="440" cy="80" r="75" fill="#85FFC7" opacity="0.3" filter="blur(20px)" />
  <circle cx="80" cy="240" r="80" fill="#297373" opacity="0.15" filter="blur(25px)" />

  <!-- Pickup Pass Card (Left) -->
  <g transform="translate(60, 48)" filter="url(#cardShadow3)">
    <rect width="190" height="230" rx="14" fill="#FFFFFF" />
    
    <!-- Header Pass -->
    <rect width="190" height="42" rx="14" fill="#297373" />
    <text x="95" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FAFAF9" text-anchor="middle">KARTU AMBIL MAKANAN</text>

    <!-- Status Pill -->
    <rect x="25" y="54" width="140" height="24" rx="12" fill="#ECFDF5" stroke="#007A55" stroke-width="0.8" />
    <circle cx="38" cy="66" r="4.5" fill="#007A55" />
    <text x="98" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#007A55" text-anchor="middle">Aktif: Siap Diambil</text>

    <!-- Schedule Info -->
    <rect x="20" y="88" width="150" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
    <text x="30" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#62748E">WAKTU DISTRIBUSI</text>
    <text x="30" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0B1C30">11:30 - 13:00 WITA</text>

    <!-- QR Code Mockup -->
    <g transform="translate(60, 146)">
      <rect width="70" height="70" rx="6" fill="#FFFFFF" stroke="#0B1C30" stroke-width="1.5" />
      <!-- QR Blocks -->
      <rect x="8" y="8" width="20" height="20" fill="#0B1C30" />
      <rect x="12" y="12" width="12" height="12" fill="#FFFFFF" />
      <rect x="15" y="15" width="6" height="6" fill="#0B1C30" />

      <rect x="42" y="8" width="20" height="20" fill="#0B1C30" />
      <rect x="46" y="12" width="12" height="12" fill="#FFFFFF" />
      <rect x="49" y="15" width="6" height="6" fill="#0B1C30" />

      <rect x="8" y="42" width="20" height="20" fill="#0B1C30" />
      <rect x="12" y="46" width="12" height="12" fill="#FFFFFF" />
      <rect x="15" y="49" width="6" height="6" fill="#0B1C30" />

      <rect x="36" y="36" width="6" height="6" fill="#0B1C30" />
      <rect x="48" y="44" width="8" height="8" fill="#0B1C30" />
      <rect x="38" y="52" width="6" height="6" fill="#0B1C30" />
    </g>
  </g>

  <!-- Meal Tray Illustration & Badges (Right) -->
  <g transform="translate(280, 70)">
    <circle cx="110" cy="100" r="75" fill="#FFFFFF" opacity="0.85" />
    <circle cx="110" cy="100" r="70" fill="#D5F5EC" />

    <!-- Meal Bento Tray -->
    <g transform="translate(30, 40)" filter="url(#cardShadow3)">
      <rect width="150" height="100" rx="16" fill="#334155" />
      <rect x="4" y="4" width="142" height="92" rx="12" fill="#1E293B" />
      
      <!-- Compartments -->
      <!-- Rice -->
      <rect x="10" y="10" width="62" height="80" rx="8" fill="#FFFFFF" />
      <g transform="translate(23, 30)">
        <ellipse cx="18" cy="22" rx="16" ry="12" fill="#E2E8F0" />
        <ellipse cx="18" cy="18" rx="15" ry="10" fill="#F8FAFC" />
        <circle cx="14" cy="16" r="1.5" fill="#CBD5E1" />
        <circle cx="21" cy="15" r="1.5" fill="#CBD5E1" />
        <circle cx="17" cy="20" r="1.5" fill="#CBD5E1" />
        <path d="M7 24 Q18 34 29 24" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>
      <!-- Main Dish -->
      <rect x="78" y="10" width="62" height="38" rx="8" fill="#FFF7ED" />
      <g transform="translate(95, 16)">
        <path d="M6 14 C6 8 18 5 24 9 C27 11 26 18 20 20 C14 22 7 19 6 14 Z" fill="#EA580C" />
        <path d="M5 16 C3 18 1 20 4 21 C6 21 8 18 6 16 Z" fill="#FDBA74" />
        <circle cx="16" cy="12" r="2" fill="#FED7AA" />
      </g>
      <!-- Veggies -->
      <rect x="78" y="52" width="62" height="38" rx="8" fill="#F0FDF4" />
      <g transform="translate(97, 58)">
        <circle cx="10" cy="10" r="6" fill="#16A34A" />
        <circle cx="17" cy="10" r="5" fill="#22C55E" />
        <circle cx="14" cy="7" r="5" fill="#4ADE80" />
        <path d="M14 14 V21" stroke="#15803D" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

    <!-- Floating Badges -->
    <g transform="translate(20, -10)" filter="url(#badgeShadow3)">
      <rect width="105" height="28" rx="14" fill="#FFFFFF" />
      <circle cx="14" cy="14" r="9" fill="#007A55" />
      <path d="M10 14 L13 17 L18 11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="18.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A">100% Higienis</text>
    </g>

    <g transform="translate(130, 150)" filter="url(#badgeShadow3)">
      <rect width="90" height="26" rx="13" fill="#FFFFFF" />
      <g transform="translate(9, 7)">
        <path d="M6 1 L7.5 4.5 L11 6 L7.5 7.5 L6 11 L4.5 7.5 L1 6 L4.5 4.5 Z" fill="#297373" />
      </g>
      <text x="26" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#297373">Siap Saji SPPG</text>
    </g>
  </g>
</svg>
