<svg width="520" height="320" viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF9F5" />
      <stop offset="50%" stop-color="#B8F2E2" />
      <stop offset="100%" stop-color="#DDF7EF" />
    </linearGradient>

    <!-- Tablet Shadow -->
    <filter id="tabletShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f2b26" flood-opacity="0.22" />
    </filter>

    <!-- Floating Badge Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="320" rx="20" fill="url(#mintBg)" />

  <!-- Soft Ambient Glow Circles -->
  <circle cx="440" cy="90" r="80" fill="#85FFC7" opacity="0.35" filter="blur(20px)" />
  <circle cx="80" cy="240" r="70" fill="#297373" opacity="0.15" filter="blur(25px)" />

  <!-- ================= TABLET MOCKUP (LEFT) ================= -->
  <g transform="translate(42, 38) rotate(-4)" filter="url(#tabletShadow)">
    <!-- Tablet Outer Bezel -->
    <rect x="0" y="0" width="220" height="250" rx="16" fill="#181E24" />
    <rect x="2" y="2" width="216" height="246" rx="14" fill="#0D1117" />
    <!-- Camera Dot -->
    <circle cx="110" cy="7" r="2.5" fill="#30363D" />

    <!-- Screen Surface -->
    <rect x="8" y="14" width="204" height="224" rx="8" fill="#FAFAF9" />

    <!-- SIM-MBG Tablet Header -->
    <rect x="8" y="14" width="204" height="26" rx="8" fill="#FFFFFF" />
    <circle cx="22" cy="27" r="6" fill="#297373" />
    <rect x="33" y="24" width="38" height="6" rx="3" fill="#297373" />
    <rect x="145" y="23" width="55" height="9" rx="4.5" fill="#EFF4FF" />
    <rect x="150" y="25" width="45" height="5" rx="2.5" fill="#297373" opacity="0.7" />

    <!-- Banner Info Tablet -->
    <rect x="14" y="46" width="192" height="34" rx="6" fill="#EFF4FF" stroke="#BDCABA" stroke-width="0.7" />
    <rect x="22" y="52" width="70" height="6" rx="3" fill="#0B1C30" />
    <rect x="22" y="62" width="50" height="5" rx="2.5" fill="#62748E" />
    <rect x="135" y="52" width="62" height="20" rx="4" fill="#297373" />
    <rect x="142" y="58" width="48" height="7" rx="3" fill="#FFFFFF" />

    <!-- Menu Cards Grid (Paket A, Paket B, Paket C) -->
    <!-- Paket A -->
    <rect x="14" y="86" width="60" height="88" rx="5" fill="#FFFFFF" stroke="#297373" stroke-width="1.2" />
    <rect x="16" y="88" width="56" height="36" rx="3" fill="#FFE8D6" />
    <g transform="translate(32, 96)">
      <rect x="2" y="3" width="20" height="15" rx="3" fill="#EA580C" />
      <circle cx="8" cy="10" r="3" fill="#FEF08A" />
      <rect x="13" y="7" width="7" height="6" rx="1.5" fill="#15803D" />
    </g>
    <rect x="18" y="128" width="38" height="5" rx="2.5" fill="#0B1C30" />
    <rect x="18" y="136" width="48" height="4" rx="2" fill="#62748E" />
    <rect x="18" y="146" width="52" height="18" rx="4" fill="#297373" />
    <rect x="26" y="152" width="36" height="5" rx="2.5" fill="#FAFAF9" />

    <!-- Paket B -->
    <rect x="80" y="86" width="60" height="88" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="82" y="88" width="56" height="36" rx="3" fill="#D8F3DC" />
    <g transform="translate(98, 96)">
      <path d="M4 14 C4 18 20 18 20 14 Z" fill="#15803D" />
      <ellipse cx="12" cy="12" rx="8" ry="4" fill="#4ADE80" />
      <circle cx="10" cy="8" r="2" fill="#F97316" />
    </g>
    <rect x="84" y="128" width="42" height="5" rx="2.5" fill="#0B1C30" />
    <rect x="84" y="136" width="50" height="4" rx="2" fill="#62748E" />
    <rect x="84" y="146" width="52" height="18" rx="4" fill="#EFF4FF" stroke="#297373" stroke-width="0.8" />
    <rect x="92" y="152" width="36" height="5" rx="2.5" fill="#297373" />

    <!-- Paket C -->
    <rect x="146" y="86" width="60" height="88" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="148" y="88" width="56" height="36" rx="3" fill="#FFF3CD" />
    <g transform="translate(164, 96)">
      <ellipse cx="12" cy="14" rx="9" ry="5" fill="#CA8A04" />
      <circle cx="9" cy="12" r="3" fill="#F8FAFC" />
      <circle cx="14" cy="10" r="2.5" fill="#DC2626" />
    </g>
    <rect x="150" y="128" width="40" height="5" rx="2.5" fill="#0B1C30" />
    <rect x="150" y="136" width="46" height="4" rx="2" fill="#62748E" />
    <rect x="150" y="146" width="52" height="18" rx="4" fill="#EFF4FF" stroke="#297373" stroke-width="0.8" />
    <rect x="158" y="152" width="36" height="5" rx="2.5" fill="#297373" />

    <!-- Bottom Nutrient Bar -->
    <rect x="14" y="180" width="192" height="36" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="22" y="186" width="60" height="5" rx="2.5" fill="#0B1C30" />
    <rect x="22" y="196" width="176" height="6" rx="3" fill="#E2E8F0" />
    <rect x="22" y="196" width="124" height="6" rx="3" fill="#297373" />
    <rect x="22" y="206" width="40" height="4" rx="2" fill="#007A55" />
    <rect x="80" y="206" width="40" height="4" rx="2" fill="#FE9A00" />
    <rect x="140" y="206" width="40" height="4" rx="2" fill="#297373" />
  </g>

  <!-- ================= CHARACTERS & GRAPHICS (RIGHT) ================= -->
  <g transform="translate(290, 75)">
    <!-- Backdrop Circle for Character -->
    <circle cx="110" cy="115" r="75" fill="#FFFFFF" opacity="0.85" />
    <circle cx="110" cy="115" r="72" fill="#D5F5EC" />

    <!-- Mother / Teacher / Nutritionist (Right) -->
    <g transform="translate(100, 20)">
      <!-- Body & Clothes (Dark Emerald/Teal Dress) -->
      <path d="M-10 170 C-10 115 10 90 35 90 C60 90 80 115 80 170 Z" fill="#1C5C54" />
      <!-- Collar / V-neck -->
      <path d="M25 90 L35 110 L45 90 Z" fill="#FFFFFF" />
      <!-- Head / Face -->
      <circle cx="35" cy="55" r="26" fill="#FBD5B5" />
      <!-- Hair / Hijab -->
      <path d="M10 50 C10 20 60 20 60 50 C60 68 55 80 50 82 C45 84 25 84 20 82 C15 80 10 68 10 50 Z" fill="#174842" />
      <!-- Smile & Eyes -->
      <circle cx="27" cy="52" r="2.8" fill="#1E293B" />
      <circle cx="43" cy="52" r="2.8" fill="#1E293B" />
      <path d="M30 63 Q35 68 40 63" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Cheeks -->
      <circle cx="23" cy="58" r="4" fill="#F87171" opacity="0.4" />
      <circle cx="47" cy="58" r="4" fill="#F87171" opacity="0.4" />
    </g>

    <!-- Student Boy (Left Foreground, Red-White Uniform) -->
    <g transform="translate(30, 80)">
      <!-- Uniform Red Shorts -->
      <path d="M12 110 L48 110 L52 140 L34 140 L34 125 L26 125 L26 140 L8 140 Z" fill="#DC2626" />
      <!-- White Shirt -->
      <path d="M5 60 C5 48 18 42 30 42 C42 42 55 48 55 60 L50 110 L10 110 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
      <!-- Red Tie -->
      <path d="M28 46 L32 46 L34 76 L30 84 L26 76 Z" fill="#DC2626" />
      <!-- Backpack Strap -->
      <path d="M12 48 L14 95" stroke="#1E3A8A" stroke-width="4.5" stroke-linecap="round" />
      <path d="M48 48 L46 95" stroke="#1E3A8A" stroke-width="4.5" stroke-linecap="round" />
      <!-- Arm pointing to screen -->
      <path d="M10 62 Q-6 72 -18 68" stroke="#FBD5B5" stroke-width="7" stroke-linecap="round" fill="none" />
      <circle cx="-20" cy="67" r="4" fill="#FBD5B5" />
      <!-- Head / Face -->
      <circle cx="30" cy="24" r="20" fill="#FBD5B5" />
      <!-- Short Boy Hair -->
      <path d="M10 22 C10 6 50 6 50 22 C50 18 45 10 30 10 C15 10 10 18 10 22 Z" fill="#1E293B" />
      <!-- Happy Face -->
      <circle cx="23" cy="22" r="2.2" fill="#1E293B" />
      <circle cx="37" cy="22" r="2.2" fill="#1E293B" />
      <path d="M25 30 Q30 36 35 30" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" fill="#FFFFFF" />
      <!-- Blush -->
      <circle cx="20" cy="26" r="3" fill="#F87171" opacity="0.5" />
      <circle cx="40" cy="26" r="3" fill="#F87171" opacity="0.5" />
    </g>
  </g>

  <!-- ================= FLOATING BADGES & TAGS ================= -->
  <!-- 1. "Bebas Alergi" Tag near tablet finger -->
  <g transform="translate(230, 95)" filter="url(#badgeShadow)">
    <rect width="90" height="28" rx="14" fill="#FFFFFF" />
    <!-- Green Check Circle inside pill -->
    <circle cx="14" cy="14" r="9" fill="#007A55" />
    <path d="M10 14 L13 17 L18 11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="29" y="18.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Bebas Alergi</text>
  </g>

  <!-- 2. Green Check Badge (Top Right) -->
  <g transform="translate(350, 48)" filter="url(#badgeShadow)">
    <circle cx="12" cy="12" r="12" fill="#007A55" />
    <path d="M7 12 L10.5 15.5 L17 9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3. Gold Ribbon Medal (Far Right) -->
  <g transform="translate(425, 52)" filter="url(#badgeShadow)">
    <!-- Ribbon tails -->
    <path d="M15 25 L8 38 L16 34 L24 38 L17 25 Z" fill="#D97706" />
    <!-- Medal Circle -->
    <circle cx="16" cy="16" r="14" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" />
    <circle cx="16" cy="16" r="11" fill="#FEF3C7" />
    <path d="M12 16 L15 19 L20 13" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 4. Floating Chart / Gizi Badge (Right Middle) -->
  <g transform="translate(432, 132)" filter="url(#badgeShadow)">
    <rect width="28" height="26" rx="6" fill="#FFFFFF" />
    <rect x="6" y="16" width="3.5" height="6" rx="1.5" fill="#297373" />
    <rect x="12" y="11" width="3.5" height="11" rx="1.5" fill="#FF8552" />
    <rect x="18" y="7" width="3.5" height="15" rx="1.5" fill="#007A55" />
  </g>

  <!-- 5. "Rekomendasi Gizi" Pill (Bottom Right) -->
  <g transform="translate(390, 172)" filter="url(#badgeShadow)">
    <rect width="102" height="24" rx="12" fill="#FFFFFF" />
    <!-- Ribbon icon inside -->
    <g transform="translate(7, 5)">
      <circle cx="7" cy="7" r="5" fill="#297373" />
      <path d="M5 11 L7 15 L9 11" stroke="#297373" stroke-width="1.5" fill="none" />
    </g>
    <text x="24" y="15.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0F172A">Rekomendasi Gizi</text>
  </g>

  <!-- 6. Floating Vegetables & Fruits Icons -->
  <g transform="translate(20, 95)" filter="url(#badgeShadow)">
    <circle cx="14" cy="14" r="13" fill="#FFFFFF" opacity="0.95" />
    <g transform="translate(6, 6)">
      <circle cx="8" cy="6" r="4.5" fill="#15803D" />
      <circle cx="5" cy="8" r="3.5" fill="#16A34A" />
      <circle cx="11" cy="8" r="3.5" fill="#22C55E" />
      <path d="M8 10 V14" stroke="#14532D" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
  <g transform="translate(18, 175)" filter="url(#badgeShadow)">
    <circle cx="14" cy="14" r="13" fill="#FFFFFF" opacity="0.95" />
    <g transform="translate(6, 6)">
      <path d="M3 10 C3 5 13 5 13 10 Z" fill="#22C55E" />
      <circle cx="8" cy="8" r="2.5" fill="#F97316" />
      <path d="M4 10 C4 14 12 14 12 10 Z" fill="#E2E8F0" />
    </g>
  </g>
  <g transform="translate(142, 260)" filter="url(#badgeShadow)">
    <circle cx="13" cy="13" r="12" fill="#FFFFFF" opacity="0.95" />
    <g transform="translate(6, 6)">
      <circle cx="7" cy="8" r="5.5" fill="#EF4444" />
      <path d="M7 2 V4 M5 3 Q7 4 9 3" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>
  </g>
  <g transform="translate(422, 235)" filter="url(#badgeShadow)">
    <circle cx="13" cy="13" r="12" fill="#FFFFFF" opacity="0.95" />
    <g transform="translate(7, 5)">
      <path d="M3 13 C3 7 9 4 10 2 C11 5 11 11 6 13 Z" fill="#DC2626" />
      <path d="M10 2 Q9 0 7 1" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
