<svg width="520" height="320" viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mintBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF9F5" />
      <stop offset="50%" stop-color="#B8F2E2" />
      <stop offset="100%" stop-color="#DDF7EF" />
    </linearGradient>
    <filter id="phoneShadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f2b26" flood-opacity="0.2" />
    </filter>
    <filter id="badgeShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="520" height="320" rx="20" fill="url(#mintBg1)" />
  <circle cx="90" cy="100" r="70" fill="#85FFC7" opacity="0.3" filter="blur(20px)" />
  <circle cx="430" cy="220" r="80" fill="#297373" opacity="0.15" filter="blur(25px)" />

  <!-- Smartphone Mockup -->
  <g transform="translate(75, 45)" filter="url(#phoneShadow1)">
    <rect width="130" height="240" rx="20" fill="#181E24" />
    <rect x="2" y="2" width="126" height="236" rx="18" fill="#0D1117" />
    <!-- Dynamic Island / Speaker -->
    <rect x="45" y="8" width="40" height="7" rx="3.5" fill="#30363D" />
    <!-- Screen -->
    <rect x="6" y="20" width="118" height="208" rx="12" fill="#FAFAF9" />

    <!-- Header App -->
    <rect x="6" y="20" width="118" height="32" rx="12" fill="#297373" />
    <circle cx="24" cy="36" r="6" fill="#85FFC7" />
    <text x="36" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FAFAF9">Daftar Siswa</text>

    <!-- Form Inputs -->
    <rect x="14" y="62" width="102" height="22" rx="4" fill="#FFFFFF" stroke="#BDCABA" stroke-width="0.8" />
    <rect x="20" y="67" width="30" height="4" rx="2" fill="#62748E" />
    <rect x="20" y="73" width="70" height="5" rx="2.5" fill="#0B1C30" />

    <rect x="14" y="92" width="102" height="22" rx="4" fill="#FFFFFF" stroke="#BDCABA" stroke-width="0.8" />
    <rect x="20" y="97" width="25" height="4" rx="2" fill="#62748E" />
    <rect x="20" y="103" width="55" height="5" rx="2.5" fill="#0B1C30" />

    <rect x="14" y="122" width="102" height="22" rx="4" fill="#FFFFFF" stroke="#BDCABA" stroke-width="0.8" />
    <rect x="20" y="127" width="20" height="4" rx="2" fill="#62748E" />
    <rect x="20" y="133" width="40" height="5" rx="2.5" fill="#0B1C30" />

    <!-- Button Submit -->
    <rect x="14" y="156" width="102" height="24" rx="6" fill="#297373" />
    <rect x="42" y="165" width="46" height="6" rx="3" fill="#FAFAF9" />

    <rect x="24" y="192" width="82" height="6" rx="3" fill="#62748E" opacity="0.5" />
  </g>

  <!-- Illustration Character & Elements (Right) -->
  <g transform="translate(260, 60)">
    <circle cx="120" cy="110" r="75" fill="#FFFFFF" opacity="0.85" />
    <circle cx="120" cy="110" r="72" fill="#D5F5EC" />

    <!-- Student Character -->
    <g transform="translate(85, 45)">
      <!-- Body -->
      <path d="M5 80 C5 55 20 45 35 45 C50 45 65 55 65 80 L60 130 L10 130 Z" fill="#FFFFFF" stroke="#E2E8F0" />
      <path d="M33 50 L37 50 L39 80 L35 88 L31 80 Z" fill="#DC2626" />
      <!-- Head -->
      <circle cx="35" cy="24" r="22" fill="#FBD5B5" />
      <path d="M13 20 C13 5 57 5 57 20 C57 15 50 8 35 8 C20 8 13 15 13 20 Z" fill="#1E293B" />
      <circle cx="28" cy="22" r="2.5" fill="#1E293B" />
      <circle cx="42" cy="22" r="2.5" fill="#1E293B" />
      <path d="M30 30 Q35 36 40 30" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" fill="#FFFFFF" />
      <circle cx="24" cy="26" r="3.5" fill="#F87171" opacity="0.5" />
      <circle cx="46" cy="26" r="3.5" fill="#F87171" opacity="0.5" />
    </g>

    <!-- Floating Badges -->
    <g transform="translate(-10, 50)" filter="url(#badgeShadow1)">
      <rect width="115" height="28" rx="14" fill="#FFFFFF" />
      <circle cx="14" cy="14" r="9" fill="#007A55" />
      <path d="M10 14 L13 17 L18 11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="29" y="18.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A">Data Terverifikasi</text>
    </g>

    <g transform="translate(140, 10)" filter="url(#badgeShadow1)">
      <circle cx="16" cy="16" r="16" fill="#FF8552" />
      <path d="M7 14 L16 9 L25 14 L16 19 Z M10 16.5 V21 C10 23.5 22 23.5 22 21 V16.5 M23 15.5 V22" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <g transform="translate(130, 140)" filter="url(#badgeShadow1)">
      <rect width="105" height="26" rx="13" fill="#FFFFFF" />
      <g transform="translate(10, 6)">
        <path d="M7 1 L1 4 V6 H13 V4 Z M2 6 V13 M5 6 V13 M9 6 V13 M12 6 V13 M0 13 H14" stroke="#297373" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </g>
      <text x="30" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#297373">Sinkron Sekolah</text>
    </g>
  </g>
</svg>
