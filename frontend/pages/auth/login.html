<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — SIM-MBG</title>
    <link rel="icon" href="../../assets/icons/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/pages/login.css">
</head>
<body class="auth-body">
    <!-- Ambient Blur Background (Figma Verified: 2 Ellipse Blur) -->
    <div class="ambient-decorations" aria-hidden="true">
        <div class="ambient-ellipse-secondary"></div>
        <div class="ambient-ellipse-accent"></div>
    </div>

    <!-- Header Auth Navigasi Ringkas (Selaras Brand Siswa) -->
    <header class="auth-header">
        <div class="container auth-nav-container">
            <a href="../../index.html" class="student-navbar-brand logo-nav" aria-label="SIM-MBG Beranda">
                <img src="../../assets/icons/logo.svg" alt="Logo SIM-MBG" width="52" height="48">
                <span class="student-brand-title logo-brand-text">SIM-MBG</span>
            </a>
            <a href="../../index.html" class="auth-back-link">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                <span>Kembali ke Beranda</span>
            </a>
        </div>
    </header>

    <!-- Main Content: Login Form Card -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Card Header -->
                <div class="auth-card-header">
                    <div class="auth-logo-badge">
                        <img src="../../assets/icons/logo.svg" alt="Logo SIM-MBG" width="56" height="52">
                    </div>
                    <h1 class="auth-title">Masuk</h1>
                </div>

                <!-- Alert Feedback Box -->
                <div class="auth-alert" id="authAlert" role="alert" style="display: none;">
                    <span class="material-symbols-outlined auth-alert-icon" id="alertIcon">info</span>
                    <span class="auth-alert-text" id="alertText"></span>
                </div>

                <!-- Form Login -->
                <form id="loginForm" class="auth-form" novalidate>
                    <!-- Kolom 1: Nama Pengguna / Email / NIS -->
                    <div class="form-group">
                        <label for="username" class="form-label">Nama Pengguna / NIS / Email</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon" aria-hidden="true">person</span>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-input" 
                                placeholder="Masukkan nama pengguna, NIS, atau email" 
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <!-- Kolom 2: Kata Sandi & Display Password Toggle -->
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="password" class="form-label">Kata Sandi</label>
                        </div>
                        <div class="input-wrapper password-wrapper">
                            <span class="material-symbols-outlined input-icon" aria-hidden="true">lock</span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Masukkan kata sandi Anda" 
                                autocomplete="current-password"
                                required
                            >
                            <button 
                                type="button" 
                                class="btn-toggle-password" 
                                id="togglePasswordBtn" 
                                aria-label="Tampilkan kata sandi" 
                                title="Tampilkan atau sembunyikan kata sandi"
                            >
                                <span class="material-symbols-outlined eye-icon" id="eyeIcon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Kolom Opsi: Remember Me & Display Password Checkbox -->
                    <div class="form-options-row">
                        <!-- Kolom Remember Me -->
                        <label class="custom-checkbox-label" for="rememberMe">
                            <input type="checkbox" id="rememberMe" name="rememberMe" class="custom-checkbox-input">
                            <span class="custom-checkbox-box">
                                <span class="material-symbols-outlined check-icon">check</span>
                            </span>
                            <span class="checkbox-text">Ingat saya</span>
                        </label>

                        <!-- Kolom Display Password -->
                        <label class="custom-checkbox-label" for="showPasswordCheck">
                            <input type="checkbox" id="showPasswordCheck" class="custom-checkbox-input">
                            <a href="#" class="auth-forgot-link" id="forgotPasswordBtn">Lupa Kata Sandi?</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-auth-submit" id="loginSubmitBtn">
                        <span class="btn-text">Masuk</span>
                        <span class="material-symbols-outlined btn-icon" aria-hidden="true">arrow_forward</span>
                    </button>
                </form>

                <!-- Bagian Paling Bawah: Kolom Register Sesuai Permintaan -->
                <div class="auth-card-footer">
                    <p class="auth-register-text">Belum ada akun? <a href="register.html" class="auth-register-link">Daftar Sekarang!</a></p>
                    <p class="auth-register-text" style="margin-top: 8px; font-size: 12px; color: var(--color-muted);">Simulasi Akses Cepat: <a href="../sppg/dashboard.html" style="color: var(--color-primary); font-weight: 600; text-decoration: underline;">Masuk sebagai SPPG</a></p>
                    <p class="auth-register-text" style="margin-top: 8px; font-size: 12px; color: var(--color-muted);">Simulasi Akses Cepat: <a href="../admin/dashboard.html" style="color: var(--color-primary); font-weight: 600; text-decoration: underline;">Masuk sebagai Administrator</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Halaman Login (Vanilla JS sesuai AGENTS.md) -->
    <script src="../../js/pages/login.js"></script>
</body>
</html>
